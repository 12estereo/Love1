
name: MI AI VIDEO - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Extraer proyecto
        run: |
          mkdir -p proyecto
          unzip -o MI_AI_VIDEO_v0_4.zip -d proyecto

      - name: Instalar SDK Android
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          cd proyecto/MI_AI_VIDEO_v0_4
          gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MI-AI-VIDEO-v0.4
          path: proyecto/MI_AI_VIDEO_v0_4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
